name: Debug Secrets Presence (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ -z "$KID" ] && echo "GPG_KEY_ID: MISSING" || echo "GPG_KEY_ID: SET"
          [ -z "$KPP" ] && echo "GPG_PASSPHRASE: MISSING" || echo "GPG_PASSPHRASE: SET"
          [ -z "$KPK" ] && echo "GPG_PRIVATE_KEY: MISSING" || echo "GPG_PRIVATE_KEY: SET"
        env:
          KID: ${{ secrets.GPG_KEY_ID }}
          KPP: ${{ secrets.GPG_PASSPHRASE }}
          KPK: ${{ secrets.GPG_PRIVATE_KEY }}
