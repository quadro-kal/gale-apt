name: Debug Secrets Presence (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ -z "${{ secrets.GPG_KEY_ID }}" ] && echo "GPG_KEY_ID: MISSING" || echo "GPG_KEY_ID: SET"
          [ -z "${{ secrets.GPG_PASSPHRASE }}" ] && echo "GPG_PASSPHRASE: MISSING" || echo "GPG_PASSPHRASE: SET"
          [ -z "${{ secrets.GPG_PRIVATE_KEY }}" ] && echo "GPG_PRIVATE_KEY: MISSING" || echo "GPG_PRIVATE_KEY: SET"
